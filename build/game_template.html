<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Glossle — ICAIRE AI Glossary Game</title>
<!-- Almarai is ICAIRE's Arabic face (they load it via next/font/google). Latin needs no
     webfont — their stack is Calibri/Carlito/Segoe UI, all system fonts. If this request is
     blocked (offline, file://, or a strict CSP) the stack below falls back cleanly. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<style>
  :root {
    /* ICAIRE brand tokens (DESIGN_SYSTEM.md §2): Midnight/Deep Forest/Signal Lime/
       Executive Gold/Ink/Canvas. correct=Deep Forest (light) swaps to Signal Lime on dark
       Midnight surfaces per §6's own rule for primary color on dark ("Primary on Midnight:
       Signal Lime fill + Midnight text, never white"); present=Executive Gold in BOTH themes,
       since gold is a status/data encoding here (§0.3 exempts it from the one-per-view budget)
       and the token is never redefined per-theme in their own globals.css either. */
    --bg:#f4f7f5; --surface:#fff; --surface-2:#e9f0eb; --ink:#16242d; --ink-soft:#4a5a63;
    --muted:#667079; --line:#e2e8e5; --line-strong:#c3cec8;
    --correct:#1c5631; --present:#d8a23a; --absent:#55697a;
    --key:#c3cec8; --key-ink:#16242d; --key-spent:#9caaa3; --key-spent-ink:#465049;
    --accent:#1c5631; --accent-hover:#164826; --tile-filled:#97a6ad;
    /* DESIGN_SYSTEM.md §7 --state-danger, reused for the DELETE key fill so it reads as a
       destructive action against ENTER's primary-action fill; #c0392b + white clears ~7.1:1 */
    --danger:#c0392b; --danger-hover:#a5301f; --on-danger:#fff;
    /* text placed ON a fill of that color — §0.2/§6: never white on Lime; Gold gets the same
       treatment since white-on-gold measures ~2.3:1, well under WCAG's 3:1 floor for large text */
    --on-correct:#fff; --on-present:#16242d; --on-absent:#fff; --on-accent:#fff;
    --glow-rgb:28,86,49;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-pill:999px; --radius-tile:14px;
    /* cards themselves are flat/no-shadow (§6); this is only for FLOATING overlays
       (result popup, how-to-play modal) — the §2 elevation tier those are legal on */
    --shadow:0 20px 48px rgba(15,42,56,.16);
    --text-scale:1;
  }
  /* Dedicated text-size control (Aa button, cycles md/lg/xl) — explicit and discoverable,
     unlike relying on the OS's own zoom/Display-Size setting (see tileSize()'s 36px floor
     for the separate fix to THAT interacting badly with the board's own layout). */
  html[data-textsize="lg"] { --text-scale:1.16; }
  html[data-textsize="xl"] { --text-scale:1.32; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f2a38; --surface:#14384a; --surface-2:#1b425a; --ink:#fff; --ink-soft:#b7c4cb;
      --muted:#8a99a1; --line:#24485c; --line-strong:#2f5468;
      --correct:#8dc63f; --present:#d8a23a; --absent:#3d5b73;
      --key:#2f5468; --key-ink:#fff; --key-spent:#16303f; --key-spent-ink:#5b7284;
      --accent:#8dc63f; --accent-hover:#79b332; --tile-filled:#4a6a82;
      --danger:#c0392b; --danger-hover:#a5301f; --on-danger:#fff;
      --on-correct:#16242d; --on-present:#16242d; --on-absent:#fff; --on-accent:#16242d;
      --glow-rgb:141,198,63;
      --shadow:0 20px 54px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"] {
    --bg:#f4f7f5; --surface:#fff; --surface-2:#e9f0eb; --ink:#16242d; --ink-soft:#4a5a63;
    --muted:#667079; --line:#e2e8e5; --line-strong:#c3cec8;
    --correct:#1c5631; --present:#d8a23a; --absent:#55697a;
    --key:#c3cec8; --key-ink:#16242d; --key-spent:#9caaa3; --key-spent-ink:#465049;
    --accent:#1c5631; --accent-hover:#164826; --tile-filled:#97a6ad;
    --danger:#c0392b; --danger-hover:#a5301f; --on-danger:#fff;
    --on-correct:#fff; --on-present:#16242d; --on-absent:#fff; --on-accent:#fff;
    --glow-rgb:28,86,49;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-pill:999px; --radius-tile:14px;
    --shadow:0 20px 48px rgba(15,42,56,.16);
  }
  :root[data-theme="dark"] {
    --bg:#0f2a38; --surface:#14384a; --surface-2:#1b425a; --ink:#fff; --ink-soft:#b7c4cb;
    --muted:#8a99a1; --line:#24485c; --line-strong:#2f5468;
    --correct:#8dc63f; --present:#d8a23a; --absent:#3d5b73;
    --key:#2f5468; --key-ink:#fff; --key-spent:#16303f; --key-spent-ink:#5b7284;
    --accent:#8dc63f; --accent-hover:#79b332; --tile-filled:#4a6a82;
    --danger:#c0392b; --danger-hover:#a5301f; --on-danger:#fff;
    --on-correct:#16242d; --on-present:#16242d; --on-absent:#fff; --on-accent:#16242d;
    --glow-rgb:141,198,63;
    --shadow:0 20px 54px rgba(0,0,0,.5);
  }

  /* ---- typography: mirrors ICAIRE's own tokens (apps/web/src/app/globals.css) ----
     They swap the whole stack by page language rather than relying on per-glyph fallback,
     so we do the same: applyStaticUI() sets <html lang>, and that flips --font-ui. */
  :root {
    --font-latin: Calibri, Carlito, "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-arabic: "Almarai", "Noto Kufi Arabic", "Segoe UI", sans-serif;
    --font-ui: var(--font-latin);
  }
  html[lang="ar"] { --font-ui: var(--font-arabic); }

  * { box-sizing:border-box; }
  /* Safari needs this in addition to the viewport lock: it suppresses the
     double-tap-to-zoom gesture on the individual controls without swallowing
     a legitimate quick second key press (for example, the two Ts in a word). */
  button { touch-action:manipulation; }
  html, body { margin:0; height:100%; touch-action:none; overscroll-behavior:none; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:var(--font-ui);
    height:100%; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .wrap { height:100%; max-width:520px; margin:0 auto; padding:10px 14px 40px;
    display:flex; flex-direction:column; gap:9px; justify-content:flex-start; }

  /* ---- header: 2 icons left, centered title, 2 icons right ----
     Pinned to LTR so the button bar does NOT mirror when the language changes: ع/? stay left,
     hint/stats/theme stay right. Only the labels swap. The board and clue still flip (Arabic
     has to read right-to-left) — it is just the chrome that stays put.
     unicode-bidi:plaintext lets the Arabic title/subtitle still lay out RTL inside this LTR bar,
     each element using its own first-strong character rather than the parent's direction. */
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:2px;
    direction:ltr; }
  header h1, header .sub { unicode-bidi:plaintext; }
  .tools-l, .tools-r { display:flex; gap:8px; flex:0 0 auto; }
  /* 320px-wide phones: the five header controls plus the title no longer fit at full size. */
  @media (max-width:340px) {
    .tools-l, .tools-r { gap:5px; }
    .icon-btn { width:36px; height:36px; }
    .diff-btn { height:30px; padding:0 9px; }
    header h1 { font-size:calc(20px * var(--text-scale, 1)); }
  }
  .title-wrap { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; align-items:center; gap:1px; }
  header h1 { margin:0; font-family:var(--font-ui); font-size:calc(25px * var(--text-scale, 1)); font-weight:800;
    letter-spacing:.02em; color:var(--ink); line-height:1; text-transform:none; white-space:nowrap; }
  header .sub { font-size:calc(11px * var(--text-scale, 1)); color:var(--muted); white-space:nowrap; }
  /* Circular icon chip (DESIGN_SYSTEM §6): 2.5rem (40px) circle, --surface-2 (raised) fill,
     icon in --accent (Forest light / Lime dark, currentColor for the inline SVG). No border —
     the chip's own fill against the page is the boundary, matching the spec's "ONE icon
     treatment site-wide" rather than the previous ad-hoc bordered square. */
  .icon-btn {
    border:none; background:var(--surface-2); color:var(--accent);
    width:40px; height:40px; border-radius:50%; cursor:pointer;
    font-family:var(--font-ui);
    font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center;
    line-height:1; padding:0; transition:transform .12s, background .2s;
  }
  .icon-btn:hover { background:var(--line); }
  .icon-btn:active { transform:scale(.94); }
  .icon-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* Difficulty toggle: a labeled pill, not a circular icon — needs to show a word, and
     tier-coded color (green/gold/red) doubles as an at-a-glance "which game am I on"
     signal even before reading the text. Tap cycles Easy → Medium → Hard → Easy. */
  .diff-btn { width:auto; height:32px; padding:0 12px; border-radius:var(--radius-pill);
    font-size:11px; letter-spacing:.03em; font-weight:800; align-self:center; }
  .diff-btn.diff-easy { background:var(--correct); color:var(--on-correct); }
  .diff-btn.diff-medium { background:var(--present); color:var(--on-present); }
  .diff-btn.diff-hard { background:var(--danger); color:var(--on-danger); }
  /* Settings menu: one 3-line button replaces the theme, text-size and passport chips. */
  .menu-wrap { position:relative; display:flex; }
  .menu { position:absolute; top:calc(100% + 8px); right:0; min-width:240px; z-index:25;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg, 16px);
    box-shadow:var(--shadow); padding:6px; display:flex; flex-direction:column;
    opacity:0; visibility:hidden; transform:translateY(-6px) scale(.97); transform-origin:top right;
    transition:opacity .18s, transform .22s cubic-bezier(.16,1,.3,1), visibility 0s .22s; }
  .menu.show { opacity:1; visibility:visible; transform:none; transition-delay:0s; }
  .menu-item { display:flex; align-items:center; gap:12px; width:100%; min-height:44px; padding:6px 10px;
    border:none; background:transparent; color:var(--ink); border-radius:12px; cursor:pointer;
    font-family:var(--font-ui); font-size:calc(15px * var(--text-scale, 1)); font-weight:600; text-align:start; }
  .menu-item:hover { background:var(--surface-2); }
  .menu-item:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .mi-ico { width:32px; height:32px; border-radius:50%; background:var(--surface-2); color:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:14px; font-weight:800; }
  .mi-ico svg { width:15px; height:15px; }
  .mi-lbl { unicode-bidi:plaintext; flex:1; text-align:left; }
  .switch { width:44px; height:26px; border-radius:13px; background:var(--line); position:relative; flex:0 0 auto;
    transition:background .2s; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .22s cubic-bezier(.16,1,.3,1); }
  [aria-checked="true"] > .switch { background:var(--accent); }
  [aria-checked="true"] > .switch::after { transform:translateX(18px); }
  .menu.rtl { direction:rtl; }
  .menu.rtl .mi-lbl { text-align:right; }
  .seg { direction:ltr; }
  .menu-row { display:flex; flex-direction:column; gap:8px; padding:8px 10px 10px; }
  .menu-row .mi-lbl { font-size:calc(13px * var(--text-scale, 1)); font-weight:700; color:var(--ink-soft); }
  .seg { display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:2px; }
  .seg-btn { flex:1; min-height:44px; border:none; background:transparent; color:var(--ink); border-radius:10px;
    cursor:pointer; font-family:var(--font-ui); font-weight:700; line-height:1; transition:background .18s, color .18s; }
  .seg-btn[aria-pressed="true"] { background:var(--accent); color:var(--on-accent, #fff); }
  .seg-btn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .hint-wrap { position:relative; display:flex; }
  .hint-count {
    position:absolute; z-index:1; top:-8px; left:50%; transform:translateX(-50%);
    min-width:17px; height:17px; padding:0 4px; border-radius:var(--radius-pill);
    background:var(--present); color:var(--on-present); border:2px solid var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; line-height:1; pointer-events:none;
  }
  .hint-btn { font-size:17px; animation:glow 2.1s ease-in-out infinite; }
  .hint-btn.spent { animation:none; opacity:.4; cursor:default; }
  @keyframes glow {
    0%,100% { box-shadow:0 0 0 0 rgba(var(--glow-rgb),0); border-color:var(--line); }
    50% { box-shadow:0 0 12px 2px rgba(var(--glow-rgb),.5); border-color:var(--correct); }
  }

  /* ---- clue ---- */
  .clue { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:9px 13px; display:flex; flex-direction:column; gap:7px; }
  /* DEFINITION now reads as an instruction, not a quiet label — booth feedback: most
     visitors didn't register this text as "the thing you're guessing" and never read it.
     A filled pill (same treatment as a real action button) plus a book icon instead of a
     bare uppercase word. The letter-count and PRACTICE pills are gone — the board itself
     already shows the word length in tiles, and PRACTICE didn't earn the clutter here. */
  .clue-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .clue .lbl { background:var(--accent); color:var(--on-accent);
    font-family:var(--font-ui); font-size:12px; letter-spacing:.06em; font-weight:800;
    padding:5px 12px 5px 10px; border-radius:var(--radius-pill);
    display:flex; align-items:center; gap:6px; }
  /* Read-aloud: a small ghost button, not a primary action — it earns a click, not a look. */
  .clue-listen { flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:none;
    background:var(--surface-2); color:var(--accent); display:grid; place-items:center;
    cursor:pointer; padding:0; transition:transform .1s, background .2s; }
  .clue-listen:hover { background:var(--line); }
  .clue-listen:active { transform:scale(.92); }
  .clue-listen:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .clue p { margin:0; font-size:calc(14.5px * var(--text-scale, 1)); line-height:1.35; color:var(--ink); font-weight:500; }
  .clue p.rtl { direction:rtl; text-align:right; font-size:calc(16px * var(--text-scale, 1)); }

  .msg { min-height:16px; text-align:center; font-size:calc(12.5px * var(--text-scale, 1)); font-weight:600; color:var(--ink-soft); }
  .msg.flash { color:var(--present); }

  /* ---- board ---- */
  .board { display:flex; flex-direction:column; gap:6px; align-items:center; margin-top:2px; }
  /* ---- first-row spotlight: booth feedback said people didn't know where to type. Dim every
     row but the active one until the player types their first letter, so the eye is pulled to
     "start here" without another overlay. Reverts to even opacity the instant they type (see
     type() in the script) — it's a one-time pointer per fresh puzzle, not a permanent state. */
  .board.spotlight .row:not(.active-row) { opacity:.3; }
  .row { display:flex; gap:7px; transition:opacity .3s ease; }
  /* Tiles read as soft filled chips at rest, not an empty outlined form grid — the
     Wordle "strict grid" look. A quiet inner ring stands in for the old 2px border. */
  .tile { border-radius:var(--radius-tile); border:none; box-shadow:inset 0 0 0 1.5px var(--line); display:grid; place-items:center; font-weight:800; text-transform:uppercase; color:var(--ink); background:var(--surface-2); user-select:none; transition:transform .12s cubic-bezier(.16,1,.3,1); }
  .tile.filled { box-shadow:inset 0 0 0 2px var(--tile-filled); background:var(--surface); animation:pop .1s ease; }
  .tile.correct { background:var(--correct); box-shadow:none; color:var(--on-correct); }
  .tile.present { background:var(--present); box-shadow:none; color:var(--on-present); }
  .tile.absent { background:var(--absent); box-shadow:none; color:var(--on-absent); }
  /* A hint shows as a faded GHOST letter, not a locked one — a reminder at the real
     position, never a forced character. Only ever drawn while the cell is still empty
     (player feedback said a locked hint blocked exploratory guesses that legitimately
     don't contain that letter); the instant they type anything there, real content wins
     and the ghost is gone — they can type right over it, on purpose or not. */
  .tile.ghost { box-shadow:inset 0 0 0 2px var(--correct); animation:pop .1s ease; }
  .tile.ghost::after { content:attr(data-ghost); color:var(--ink-soft); opacity:.55; }
  /* A bouncy squash-and-pop stands in for Wordle's mechanical 3D flip — same reveal
     timing (the JS swaps color at the 50% mark, mid-squash, same as before) but it
     reads as a playful little bounce instead of a card flipping over. */
  .tile.reveal { animation:flip .5s ease forwards; }
  .row.shake { animation:shake .5s; }
  @keyframes pop { 0%{transform:scale(.9);} 100%{transform:scale(1);} }
  @keyframes flip { 0%{transform:rotateX(0);} 50%{transform:rotateX(90deg);} 100%{transform:rotateX(0);} }
  @keyframes shake { 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-6px);} 40%,60%{transform:translateX(6px);} }

  /* ---- win celebration: the one place a bounce is earned — a rare achievement moment,
     not routine feedback (see .tile.reveal above, which deliberately does NOT bounce). ---- */
  .result .verdict.win { animation:win-pop .55s cubic-bezier(.34,1.56,.64,1); }
  @keyframes win-pop { 0%{transform:scale(.7);} 60%{transform:scale(1.12);} 100%{transform:scale(1);} }
  .confetti-layer { position:fixed; inset:0; pointer-events:none; z-index:40; overflow:hidden; }
  .confetti-piece { position:absolute; top:-12px; width:7px; height:13px; border-radius:2px; opacity:0;
    animation:confetti-fall 1.15s cubic-bezier(.36,.01,.44,1) forwards; }
  @keyframes confetti-fall {
    0%   { transform:translateY(0) rotate(0deg); opacity:1; }
    100% { transform:translateY(340px) rotate(340deg); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .result .verdict.win { animation:none; }
    .confetti-piece { display:none; }
  }

  /* ---- keyboard ----
     Laid out like a real iOS keyboard (reference: system QWERTY) rather than the old
     Wordle-style row: DELETE sits at the end of the LAST LETTER row — same position as
     the system ⌫ key — and ENTER is its own key on the row below, same position as the
     system return key. That's what "above" meant: delete is physically one row above
     enter, not two competing full-width bars. Every key gets a slight keycap shadow so
     it reads as a raised, tappable button the way iOS's own keys do. */
  .kb { display:flex; flex-direction:column; gap:6px; margin-top:auto; }
  .kb-row { display:flex; gap:4px; justify-content:center; }
  .key { flex:1; min-width:0; height:46px; border-radius:var(--radius-md); border:none; background:var(--key); color:var(--key-ink); font-size:14px; font-weight:700; text-transform:uppercase; cursor:pointer; display:grid; place-items:center; box-shadow:0 2px 4px rgba(0,0,0,.18); transition:transform .1s ease-out, filter .2s, background .3s, box-shadow .1s ease-out; }
  .key.wide { flex:1.5; font-size:16px; }
  .key:hover { filter:brightness(1.06); }
  /* Respond on press, not release — the interface should feel grabbed the instant a
     finger lands, not after it lifts (Apple's "response on pointer-down" rule). A slight
     scale-down reads as a physical press; translateY felt like the key sliding away. */
  .key:active { transform:scale(.95); box-shadow:0 0.5px 1px rgba(0,0,0,.18); }
  .key.correct { background:var(--correct); color:var(--on-correct); }
  .key.present { background:var(--present); color:var(--on-present); }
  .key.absent { background:var(--key-spent); color:var(--key-spent-ink); }

  /* DELETE: end of the last letter row, like the system ⌫ key — colored red so its
     destructive purpose reads at a glance (booth feedback: a same-gray key went unnoticed). */
  .key.danger { background:var(--danger); color:var(--on-danger); font-size:17px; }
  .key.danger:hover { background:var(--danger-hover); filter:none; }
  /* ENTER: its own row below, like the system return key — full width since this
     keyboard has no space bar, colored green as the primary/confirm action. */
  .key.confirm { flex:1; height:48px; font-size:14px; letter-spacing:.03em; display:flex; align-items:center; justify-content:center; gap:8px; background:var(--accent); color:var(--on-accent); }
  .key.confirm:hover { background:var(--accent-hover); filter:none; }

  /* ---- result ---- */
  /* Scrim behind the result card: blurs + dims the board so a finished puzzle doesn't
     read as "still playable" underneath the popup. Fixed, so it covers the full screen
     regardless of where .result sits in the DOM; fades with the card itself. */
  .result-backdrop { position:fixed; inset:0; z-index:19; background:rgba(8,18,24,.5);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .26s cubic-bezier(.22,1,.36,1), visibility 0s linear .26s; }
  .result-backdrop.show { opacity:1; visibility:visible;
    transition:opacity .26s cubic-bezier(.22,1,.36,1); }
  /* Materializes in rather than snapping to visible — a small spring-ish scale+fade
     instead of an instant display toggle (still fully hidden/non-interactive at rest). */
  .result { position:absolute; inset:0; margin:auto; height:max-content; max-width:400px; z-index:20;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:9px;
    opacity:0; transform:scale(.94) translateY(6px); visibility:hidden; pointer-events:none;
    transition:opacity .26s cubic-bezier(.22,1,.36,1), transform .3s cubic-bezier(.22,1,.36,1), visibility 0s linear .3s; }
  .result.show { opacity:1; transform:scale(1) translateY(0); visibility:visible; pointer-events:auto;
    transition:opacity .26s cubic-bezier(.22,1,.36,1), transform .3s cubic-bezier(.22,1,.36,1); }
  .result .verdict { font-size:12.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
  .result .verdict.win { color:var(--correct); }
  .result .verdict.lose { color:var(--present); }
  .result .verdict.soft { color:var(--accent); }   /* a reveal, not a fail */
  .result .term-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }

  // Tiles are sized from MEASURED space, not a guessed budget, so the board uses every pixel
  // actually free and its outer edges line up with the clue card and the keyboard above and
  // below it (they all sit in the same .wrap content box).
  function tileSize() {
    var cs = getComputedStyle(wrapEl);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var gap = parseFloat(cs.rowGap) || 9;               // .wrap's flex gap
    // read the real gap rather than hardcoding it — the mobile media query shrinks it
    var TILE_GAP = parseFloat(getComputedStyle(board).rowGap) || 6;

    // width: the exact content width the keyboard rows span, so the board matches it.
    // Guard against a zero/absurd measurement — this runs while the game is still hidden
    // inside the demo drawer's iframe, and a truthy-but-tiny clientWidth would otherwise
    // lock the board at the 28px minimum until something forced a resize.
    var innerW = wrapEl.clientWidth - padX;
    if (!(innerW > 120)) innerW = 492;
    var byW = (innerW - TILE_GAP * (cols - 1)) / cols;

    // height: whatever is left after the real chrome (header + clue + message + keyboard
    // + the four .wrap gaps), rather than assuming a fixed ~430px
    var chrome = headerEl.offsetHeight + clueBox.offsetHeight + msgEl.offsetHeight +
                 kbEl.offsetHeight + gap * 4 + 4;       // +4 = .board margin-top and slack
    var wrapH = wrapEl.clientHeight;
    if (!(wrapH > 200)) wrapH = 640;
    var innerH = wrapH - padY - chrome;
    var byH = (innerH - TILE_GAP * (ROWS - 1)) / ROWS;

    // Floor raised from 28→36: iOS's own "Display Zoom" (Settings > Display & Brightness)
    // reports a NARROWER viewport in exchange for bigger on-screen UI everywhere else —
    // exactly what an older player reaches for instead of pinch-zoom (which this game
    // blocks on purpose, see the touch handlers below). Without a real floor, that makes
    // our width-driven math shrink the board right when she's asking the phone to enlarge
    // it. 36px stays comfortably inside even a narrow Zoomed viewport at 7 columns.
    // A short screen (iPhone SE class) is height-limited, not width-limited: there the floor
    // follows the height that is actually free (down to 22) so the keyboard stays on screen.
    var floor = byH < 36 ? Math.max(22, Math.floor(byH)) : 36;
    return Math.max(floor, Math.min(96, Math.floor(Math.min(byW, byH))));
  }

  function buildKeyboard() {

      var row = document.createElement("div"); row.className = "kb-row"; row.style.direction = "ltr";

  // hide the answer word if it appears inside its own definition
  function stripDiac(s) { return s.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, ""); }

    var target = canon(ans);
    return def.split(/(\s+)/).map(function (tok) {
      var bare = tok.replace(/[^A-Za-z\u0621-\u064A\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g, "");
      return (bare && canon(bare) === target) ? "▁▁▁▁" : tok;
    }).join("");

  function dayNumber() {

    return Math.floor((today - Date.UTC(2026, 0, 1)) / 86400000);
  }

  }

  }

  var PRACTICE_COOLDOWN_MS = 24 * 60 * 60 * 1000;

  // day's state, so reloading a finished puzzle re-shows the card without re-counting it.
  function recordResult(won) {

    if (state.counted) return;

  }

  // Three difficulty tiers, each its own hand-picked, non-overlapping subset of the real

  function poolFor(lvl) {

             "SAFETY", "PRIVACY", "SAMPLE", "SYSTEM", "CLASS", "BATCH", "FEATURE"],
        ar: ["وكيل", "نموذج", "روبوت", "بيانات", "خصوصية", "سلامة", "عينة", "نظام",
             "وحدة", "مستخدم", "مثال", "تدريب", "تصنيف", "تنبؤ", "طبقة"]
      },
      medium: {
        en: ["ACTION", "LAYER", "METRIC", "NEURON", "OBJECT", "POLICY", "PYTHON", "RECALL",
             "RETURN", "REWARD", "WEIGHT", "EXAMPLE", "FRAME", "DEPTH", "ENTITY"],
        ar: ["كيان", "مقياس", "سياسة", "عائد", "مكافأة", "بايثون", "معامل", "مصنف",

      },
      hard: {
        en: ["CLUSTER", "CORPUS", "DECODER", "ENCODER", "EPOCH", "KERNEL", "LAMBDA",
             "LATENCY", "OUTLIER", "PADDING", "PANDAS", "SCORING", "SYNAPSE", "TENSOR", "TORCH"],
        ar: ["إطار", "تحسين", "تدرج", "تشذيب", "تضمين", "تعزيز", "تقارب", "تقطيع",
             "تينسر", "دورة", "لامدا", "محول", "مدونة", "نواة"]
      }

    var listed = (poolFor(difficulty) || {})[lang] || [];
    var pool = listed.length ? keys.filter(function (k) { return listed.indexOf(k) !== -1; }) : keys;
    return pool.length ? pool : keys;   // curated list stale vs. the real bank — fall back rather than break
  }
  function pickAnswer(keys) {
    var pool = tierPool(keys);
    if (!practice) return pool[dayNumber() % pool.length];   // same word for everyone AT THIS TIER, once per day
    var recent = loadSolvedCooldowns(), now = Date.now();
    var available = pool.filter(function (key) { return !recent[key] || now - recent[key] >= PRACTICE_COOLDOWN_MS; });
    // A very small bank can eventually be exhausted. In that case preserve the old
    // no-immediate-repeat guarantee rather than leaving the player without a puzzle.
    if (!available.length) available = pool.filter(function (key) { return key !== answer; });
    if (!available.length) available = pool;
    return available[Math.floor(Math.random() * available.length)];

  // A hint is a board POSITION, not just a letter: state.hints holds the column indices

  // that position — never a locked letter (see .tile.ghost: forcing it into every guess
  // made it IMPOSSIBLE to test a word that legitimately doesn't contain that letter).
  function revealedIndices() {
    return state.hints
      .concat(typeof state.freeHint === "number" ? [state.freeHint] : [])
      .concat(Array.isArray(state.progressive) ? state.progressive : []);
  }

  // Easy's progressive reveal: grant up to n NEW positions (never re-revealing one already
  // known), coloring the keyboard the same way a paid hint does. Caps at cols-1 so the
  // board is never fully solved for you.
  function grantProgressiveReveal(n) {
    if (!Array.isArray(state.progressive)) state.progressive = [];
    for (var k = 0; k < n && revealedIndices().length < cols - 1; k++) {
      var idx = pickHintIndex();
      if (idx === null) break;
      state.progressive.push(idx);
      updateKey(normChar(answer[idx]), "correct");
    }
  }

  // Draws (or clears) the ghost for every revealed position in row r. A ghost only ever
  // shows on a still-EMPTY cell — real typed content (right or deliberately not) always
  // wins, so this never blocks or pre-fills a guess.
  function refreshGhosts(r) {
    if (!grid[r]) return;
    revealedIndices().forEach(function (idx) {
      var cell = grid[r].cells[idx];
      if (!cell) return;
      if (cell.textContent === "") { cell.classList.add("ghost"); cell.setAttribute("data-ghost", answer[idx]); }
      else { cell.classList.remove("ghost"); cell.removeAttribute("data-ghost"); }
    });
  }

  function restoreHints() {
    if (!Array.isArray(state.hints)) state.hints = [];
    state.hints = state.hints.filter(function (i) { return typeof i === "number" && i >= 0 && i < cols; });
    if (typeof state.freeHint !== "number" || state.freeHint < 0 || state.freeHint >= cols) state.freeHint = null;
    if (!Array.isArray(state.progressive)) state.progressive = [];
    state.progressive = state.progressive.filter(function (i) { return typeof i === "number" && i >= 0 && i < cols; });
    // A fresh Easy puzzle (nothing typed, nothing revealed yet) starts with its head start
    // already on the board — "work it out together," not "prove you already knew it."
    if (diffCfg().progressiveReveal && state.guesses.length === 0 && !state.progressive.length) {
      grantProgressiveReveal(cols >= 6 ? (diffCfg().progressiveStart || 2) : 1);   // 5-letter words: one, or the definition gives it away
    }
    // keyboard reflects revealed letters too — reinforcement, not the primary signal anymore
    revealedIndices().forEach(function (idx) { updateKey(normChar(answer[idx]), "correct"); });
    hintsUsed = state.hints.length;
    updateHintUI();
  }

  function loadDay() {
    var w = WORDS();
    var keys = Object.keys(w).sort();
    answer = pickAnswer(keys);
    cols = answer.length;
    curRow = 0; over = false; hintsUsed = 0; keyState = {};
    buildBoard();
    Object.keys(keyEls).forEach(function (k) { keyEls[k].className = "key"; });
    clueEl.textContent = censorClue(w[answer].def, answer);
    hideResult();   // also drops the blur backdrop — a direct className reset here left it stuck
    hintWrap.style.display = ""; statsBtn.style.display = "none";
    resetCardBtns();
    setMsg("");
    // restore today's progress for this language (practice always starts clean)
    state = (practice ? null : loadState()) || { guesses: [], done: false, won: false, counted: false, hints: [], progressive: [] };
    state.guesses.forEach(function (g) { replayGuess(g); });
    // Hint letters persist with the game, so refreshing never refunds or duplicates a hint.
    restoreHints();
    if (!state.done) refreshGhosts(curRow);
    // Row spotlight: on a brand-new board (nothing typed yet), dim every row but the first
    // so the eye is pulled to "start here" — booth visitors didn't know where to type.
    // type() below clears it the instant a letter goes in; a resumed/finished game skips it.
    board.classList.toggle("spotlight", state.guesses.length === 0 && !state.done);
    if (state.guesses.length === 0 && grid[0]) grid[0].el.classList.add("active-row");
    if (state.done) { over = true; finish(state.won); }
  }

  function replayGuess(guess) {
    for (var i = 0; i < cols; i++) { grid[curRow].cells[i].textContent = guess[i]; }
    var score = scoreGuess(guess, answer);
    for (var j = 0; j < cols; j++) { grid[curRow].cells[j].classList.add(score[j]); updateKey(guess[j], score[j]); }
    if (normWord(guess) !== normWord(answer)) curRow++;
  }

  function setMsg(text, flash) { msgEl.textContent = text; msgEl.className = flash ? "msg flash" : "msg"; }

  function acceptChar(k) {
    if (lang === "en") { return /^[A-Za-z]$/.test(k) ? k.toUpperCase() : null; }
    return /^[ء-ي]$/.test(k) ? k : null;
  }
  function handleKey(k) {
    if (over) return;
    if (k === "Enter") return submit();
    if (k === "Backspace") return del();
    var ch = acceptChar(k); if (ch) type(ch);
  }

  function nextEmptyCol(r) { for (var c = 0; c < cols; c++) { if (grid[r].cells[c].textContent === "") return c; } return -1; }
  function lastTypedCol(r) { for (var c = cols - 1; c >= 0; c--) { if (grid[r].cells[c].textContent !== "") return c; } return -1; }
  function rowFull(r) { return nextEmptyCol(r) === -1; }

  function type(ch) {
    var c = nextEmptyCol(curRow); if (c < 0) return;
    var cell = grid[curRow].cells[c]; cell.textContent = ch; cell.classList.add("filled"); setMsg("");
    refreshGhosts(curRow);   // typing over a ghost (their letter or not) retires it
    // the first keystroke of a fresh puzzle has done its job as a pointer — even out the board
    if (board.classList.contains("spotlight")) board.classList.remove("spotlight");
  }
  function del() {
    var c = lastTypedCol(curRow); if (c < 0) return;
    var cell = grid[curRow].cells[c]; cell.textContent = ""; cell.classList.remove("filled");
    refreshGhosts(curRow);   // clearing the cell brings its ghost back, if it has one
  }
  function currentGuess() { return grid[curRow].cells.map(function (c) { return c.textContent; }).join(""); }

  // Positions the player has already confirmed correct from a PAST submitted guess (a
  // green tile earned by playing, not by hinting) — scored the same way scoreGuess()
  // determines "correct": exact letter, exact spot.
  function knownCorrectIndices() {
    var out = [];
    state.guesses.forEach(function (g) {
      for (var i = 0; i < cols; i++) {
        if (normChar(g[i]) === normChar(answer[i]) && out.indexOf(i) === -1) out.push(i);
      }
    });
    return out;
  }

  // Shared by the 💡 button and the free auto-hint below: pick a board position that
  // isn't already known — either already hinted, or already green from a real guess —
  // so a hint never "reveals" a letter the player already has.
  function pickHintIndex() {
    var used = revealedIndices().concat(knownCorrectIndices());
    var candidates = [];
    for (var i = 0; i < answer.length; i++) { if (used.indexOf(i) === -1) candidates.push(i); }
    return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : null;
  }

  function submit() {
    if (!rowFull(curRow)) { shakeRow(); setMsg(B().ui.need(cols), true); return; }
    var guess = currentGuess();
    if (!isValidGuess(guess)) { shakeRow(); setMsg(B().ui.notTerm, true); return; }
    var score = scoreGuess(guess, answer);
    paintRow(curRow, guess, score);
    state.guesses.push(guess);
    if (normWord(guess) === normWord(answer)) {
      over = true; state.done = true; state.won = true; recordResult(true);
      setTimeout(function () { finish(true); }, cols * 240 + 250); return;
    }
    curRow++;
    // Booth feedback: people gave up after just a couple of misses. A free, non-budget hint
    // (doesn't touch the 💡 counter) fires once, automatically, after freeHintAfter misses —
    // Easy fires sooner, Hard never fires at all (freeHintAfter: null). state.freeHint
    // persists so a refresh can't re-grant it.
    if (!over && diffCfg().progressiveReveal) {
      // Easy: one more letter after every miss, not just once.
      grantProgressiveReveal(1);
      refreshGhosts(curRow);
      setTimeout(function () { setMsg(B().ui.freeHint, true); }, cols * 240 + 300);
    } else {
      var freeAt = diffCfg().freeHintAfter;
      if (!over && freeAt != null && curRow === freeAt && state.freeHint == null) {
        var free = pickHintIndex();
        if (free !== null) {
          state.freeHint = free;
          updateKey(normChar(answer[free]), "correct");
          refreshGhosts(curRow);
          setTimeout(function () { setMsg(B().ui.freeHint, true); }, cols * 240 + 300);
        }
      } else if (!over) {
        refreshGhosts(curRow);
      }
    }
    if (curRow >= ROWS) { over = true; state.done = true; state.won = false; recordResult(false); setTimeout(function () { finish(false); }, cols * 240 + 250); }
    else { saveState(); }
  }

  function scoreGuess(guess, ans) {
    var res = new Array(cols).fill("absent");
    var pool = ans.split("").map(normChar);
    var g = guess.split("").map(normChar);
    for (var i = 0; i < cols; i++) { if (g[i] === pool[i]) { res[i] = "correct"; pool[i] = null; } }
    for (var j = 0; j < cols; j++) { if (res[j] === "correct") continue; var idx = pool.indexOf(g[j]); if (idx > -1) { res[j] = "present"; pool[idx] = null; } }
    return res;
  }

  function paintRow(r, guess, score) {
    var cells = grid[r].cells;
    for (var i = 0; i < cols; i++) {
      (function (i) {
        var cell = cells[i];
        setTimeout(function () {
          cell.classList.add("reveal");
          setTimeout(function () {
            cell.classList.remove("filled"); cell.classList.add(score[i]);
            updateKey(guess[i], score[i]);
          }, 250);
        }, i * 240);
      })(i);
    }
  }

  var RANK = { absent: 0, present: 1, correct: 2 };
  function updateKey(ch, state) {
    var k = normChar(ch), prev = keyState[k];
    if (prev && RANK[prev] >= RANK[state]) return;
    keyState[k] = state;
    var el = keyEls[k];
    if (el) { el.classList.remove("correct", "present", "absent"); el.classList.add(state); }
  }

  function shakeRow() { var row = grid[curRow].el; row.classList.add("shake"); setTimeout(function () { row.classList.remove("shake"); }, 500); }

  // A short, brand-colored confetti burst — the one celebratory moment in the whole game,
  // reserved for an actual win so it still means something. Respects reduced-motion via
  // the CSS media query above (the pieces just don't animate/display).
  var CONFETTI_COLORS = ["#1c5631", "#8dc63f", "#d8a23a", "#ffffff"];
  function celebrate() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    confettiLayer.innerHTML = "";
    for (var i = 0; i < 22; i++) {
      var p = document.createElement("span"); p.className = "confetti-piece";
      p.style.left = Math.round(Math.random() * 100) + "%";
      p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      p.style.animationDelay = (Math.random() * 0.25) + "s";
      p.style.transform = "rotate(" + Math.round(Math.random() * 90) + "deg)";
      confettiLayer.appendChild(p);
    }
    setTimeout(function () { confettiLayer.innerHTML = ""; }, 1600);
  }

  // ---- passport: a local, non-competitive log of every term reached (won or revealed).
  // Keyed by language only, not difficulty or date — learning SYSTEM once still counts
  // whichever tier or day it happened on.
  function learnedKey() { return "promptle.learned." + lang; }
  function loadLearned() {
    try { var v = JSON.parse(localStorage.getItem(learnedKey())); return (v && typeof v === "object") ? v : {}; } catch (e) { return {}; }
  }
  function rememberLearnedTerm() {
    try {
      var store = loadLearned();
      if (!store[answer]) store[answer] = { ts: Date.now() };
      localStorage.setItem(learnedKey(), JSON.stringify(store));
    } catch (e) {}
  }
  // A term's tier is whichever difficulty pool lists it, so nothing extra is stored per term.
  function tierOfTerm(t) {
    for (var i = 0; i < DIFFICULTY_ORDER.length; i++) {
      if ((poolFor(DIFFICULTY_ORDER[i])[lang] || []).indexOf(t) !== -1) return DIFFICULTY_ORDER[i];
    }
    return "medium";
  }
  function showPassport() {
    var w = WORDS(), store = loadLearned(), ui = B().ui;
    var terms = Object.keys(store).filter(function (t) { return w[t]; })
      .sort(function (a, b) { return (store[b].ts || 0) - (store[a].ts || 0); });
    var list = document.getElementById("passportList");
    list.innerHTML = "";
    if (!terms.length) {
      var empty = document.createElement("p"); empty.className = "passport-empty"; empty.textContent = ui.passportEmpty;
      list.appendChild(empty);
    } else {
      terms.forEach(function (t) {
        var item = document.createElement("div"); item.className = "passport-item";
        var line = document.createElement("div"); line.className = "term-line";
        var term = document.createElement("div"); term.className = "term"; term.textContent = t;
        var tier = tierOfTerm(t), tag = document.createElement("span");
        tag.className = "tier-tag diff-" + tier; tag.textContent = ui.diffLabels[tier];
        line.appendChild(term); line.appendChild(tag);
        var def = document.createElement("div"); def.className = "def"; def.textContent = w[t].def;
        item.appendChild(line); item.appendChild(def); list.appendChild(item);
      });
    }
    document.getElementById("passportKicker").textContent = ui.passportKicker;
    document.getElementById("passportTitle").textContent = ui.passportTitle;
    document.getElementById("passportCloseBtn").textContent = ui.passportClose;
    document.getElementById("passportModal").className = "modal passport-modal" + (lang === "ar" ? " rtl" : "");
    passportOverlay.classList.add("show");
  }
  function hidePassport() { passportOverlay.classList.remove("show"); }

  function finish(won) {
    var w = WORDS(), v = document.getElementById("verdict");
    // No hard fail state in practice/booth play or on Easy/Medium — a warm reveal instead
    // of "you lost". Hard, on the real daily puzzle, keeps genuine stakes.
    var softLoss = !won && (practice || difficulty !== "hard");
    v.textContent = won ? B().ui.cheer : (softLoss ? B().ui.loseSoft : B().ui.lose);
    v.className = "verdict " + (won ? "win" : (softLoss ? "soft" : "lose"));
    document.getElementById("rTerm").textContent = answer;
    var tr = w[answer].tr || "";
    document.getElementById("rTr").textContent = tr ? (B().ui.trLabel + ": " + tr) : "";
    document.getElementById("rDef").textContent = w[answer].def;
    renderStats();
    resetCardBtns();
    showResult();
    if (won) celebrate();
    rememberLearnedTerm();   // the term was revealed either way — win or a soft/hard loss
    // the hint is dead weight once the puzzle is over — give the slot to the result toggle
    hintWrap.style.display = "none"; statsBtn.style.display = "flex";
    setMsg("");
  }

  // ---- show / hide the result card so the player can look back at their tries ----
  // The scrim always fades in lockstep with the card — finishing a puzzle should read as
  // "this is over, look here," not leave the board looking equally live behind the popup.
  function showResult() { resultEl.className = "result show" + (lang === "ar" ? " rtl" : ""); resultBackdrop.classList.add("show"); }
  function hideResult() { resultEl.className = "result" + (lang === "ar" ? " rtl" : ""); resultBackdrop.classList.remove("show"); }
  function toggleResult() {
    if (resultEl.classList.contains("show")) hideResult(); else showResult();
  }

  // ---- share the game itself (not the player's result) ----
  // Swap this for the real host once the game has a public home. The artifact link is
  // private until it is shared from the artifact page's own share menu.
  var SHARE_URL = "https://ahmed-khayat.github.io/promptle/";
  var SHARE_ICON = rShare.innerHTML;
  var CHECK_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4 6.4 11.8 13 4.6"/></svg>';

  function shareGame() {
    try { pBump("share"); } catch (e) {}
    var ui = B().ui, body = ui.shareBlurb + "\n" + SHARE_URL;
    if (navigator.share) {
      try {
        // native share sheet on mobile; a cancelled sheet rejects, which is not an error
        navigator.share({ title: ui.shareTitle, text: ui.shareBlurb, url: SHARE_URL })
          .then(shareOk, function () {});
        return;
      } catch (e) { /* fall through to clipboard */ }
    }
    copyText(body).then(shareOk, function () { window.prompt(ui.shareTitle, body); });
  }
  function shareOk() {
    clearTimeout(shareTimer);
    rShare.innerHTML = CHECK_ICON;
    rShare.style.color = "var(--correct)";
    shareTimer = setTimeout(resetCardBtns, 1700);
  }

  function copyText(txt) {
    // execCommand fallback matters: the standalone file runs from file://, where the
    // async clipboard API is frequently unavailable
    function legacy() {
      try {
        var ta = document.createElement("textarea");
        ta.value = txt;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, txt.length);
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(txt).catch(function () {
        if (!legacy()) throw new Error("copy failed");
      });
    }
    return legacy() ? Promise.resolve() : Promise.reject(new Error("copy failed"));
  }
  // ---- "learn more": deep-link to the glossary entry for the word just played ----
  // Opens the EthicalStack *dashboard* (the AI-Glossary-Challenge-by-ICAIRE repo) on the
  // Explorer view with the term's entry already showing — English, Arabic AND French
  // definitions plus aliases and sources, in the real UI rather than raw JSON.
  // (?term= is handled by deepLinkTerm() at the bottom of dashboard/app.js.)
  // The API serves the dashboard and must be running:
  //   cd api && source venv/bin/activate && uvicorn app.main:app
  // Change GLOSSARY_BASE to the public host once it is deployed somewhere.
  var GLOSSARY_BASE = "http://127.0.0.1:8000";
  var GLOSSARY_PATH = "/dashboard/?term=";
  function glossaryHref() {
    // the API indexes English terms only, so in Arabic mode look up the English equivalent
    // (stored as .tr on every Arabic entry). get_exact() is case-insensitive.
    var w = WORDS()[answer] || {};
    var term = (lang === "en") ? answer : (w.tr || answer);
    return GLOSSARY_BASE + GLOSSARY_PATH + encodeURIComponent(term);
  }

  // A link to a localhost API is useless to anyone opening a shared copy of this game, so
  // only offer it when the page itself is running locally. No network probe: a fetch from an
  // https artifact to http://127.0.0.1 is blocked as mixed content and would give a false
  // negative even when the API is up.
  function glossaryUsable() {
    var localApi = /^https?:\/\/(127\.0\.0\.1|localhost)\b/.test(GLOSSARY_BASE);
    var localPage = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) || location.protocol === "file:";
    return !localApi || localPage;
  }

  function setPractice(on) {
    practice = on;
    hideResult();
    loadDay();
  }

  // Switching tiers reloads ROWS/MAX_HINTS from the new tier's config before the board
  // and keyboard rebuild — buildBoard() reads ROWS fresh every call, so this is enough.
  function setDifficulty(next) {
    if (DIFFICULTY_ORDER.indexOf(next) === -1 || next === difficulty) return;
    difficulty = next;
    saveDifficulty();
    ROWS = diffCfg().rows;
    MAX_HINTS = diffCfg().maxHints;
    applyStaticUI();
    hideResult();
    loadDay();
  }

  var shareTimer = null;
  function resetCardBtns() {
    clearTimeout(shareTimer);
    learnBtn.textContent = B().ui.learn;
    learnBtn.href = glossaryHref();
    learnBtn.style.display = glossaryUsable() ? "flex" : "none";
    // in daily mode this is the "you're locked out until tomorrow — but keep playing" escape
    nextBtn.textContent = practice ? B().ui.next : B().ui.keep;
    nextBtn.style.display = "flex";
    tierRow.innerHTML = "";
    if (!practice) DIFFICULTY_ORDER.forEach(function (tier) {
      if (tier === difficulty || tierDoneToday(tier)) return;
      var b = document.createElement("button");
      b.className = "resbtn diff-" + tier;
      b.textContent = B().ui.tryTier(B().ui.diffLabels[tier]);
      b.addEventListener("click", function () { setDifficulty(tier); });
      tierRow.appendChild(b);
    });
    rShare.innerHTML = SHARE_ICON;
    rShare.style.color = "";
  }

  // ---- how-to-play: a forced 3-step tutorial, not a single bullet list. Booth feedback:
  // visitors don't recognize Wordle and the game wasn't self-explanatory, so this walks
  // WHAT it is → HOW the colors work (with a real worked example board) → WHERE to type,
  // one idea per screen with Back/Next instead of dumping everything at once.
  var tutStep = 0;
  function renderTutStep() {
    var ui = B().ui, steps = ui.tutorial.steps, step = steps[tutStep];
    document.getElementById("modal").className = "modal" + (lang === "ar" ? " rtl" : "");
    document.getElementById("mKicker").textContent = step.kicker;
    document.getElementById("mTitle").textContent = step.title;

    var exampleEl = document.getElementById("mExample");
    exampleEl.innerHTML = "";
    if (step.example) {
      exampleEl.style.display = "flex";
      var word = step.example.word;
      step.example.pattern.forEach(function (cls, i) {
        var t = document.createElement("div"); t.className = "tile " + cls; t.textContent = word[i];
        exampleEl.appendChild(t);
      });
    } else { exampleEl.style.display = "none"; }

    var listEl = document.getElementById("mList");
    listEl.innerHTML = "";
    if (step.legend) {
      listEl.style.display = "flex";
      step.legend.forEach(function (item) {
        var li = document.createElement("li");
        var mark = document.createElement("span"); mark.className = "sw " + item.sw;
        var txt = document.createElement("span"); txt.textContent = item.t;
        li.appendChild(mark); li.appendChild(txt); listEl.appendChild(li);
      });
    } else { listEl.style.display = "none"; }

    var bodyEl = document.getElementById("mBody");
    if (step.body) { bodyEl.style.display = "block"; bodyEl.textContent = typeof step.body === "function" ? step.body(ROWS) : step.body; }
    else { bodyEl.style.display = "none"; bodyEl.textContent = ""; }

    var dotsEl = document.getElementById("mDots"); dotsEl.innerHTML = "";
    steps.forEach(function (_, i) {
      var d = document.createElement("span"); if (i === tutStep) d.className = "on"; dotsEl.appendChild(d);
    });

    var backBtn = document.getElementById("backBtn");
    backBtn.hidden = (tutStep === 0);
    backBtn.textContent = ui.tutorial.back;

    document.getElementById("okBtn").textContent = (tutStep === steps.length - 1) ? ui.tutorial.start : ui.tutorial.next;
  }
  function tutAdvance() {
    var steps = B().ui.tutorial.steps;
    if (tutStep < steps.length - 1) { tutStep++; renderTutStep(); } else { hideHelp(); }
  }
  function tutBack() { if (tutStep > 0) { tutStep--; renderTutStep(); } }
  // "Seen the instructions" is remembered forever, not per day — the popup auto-opens only on
  // a first visit. Stored under its own key (not the date-scoped one) so it survives midnight.
  // Marked on dismiss rather than on show: closing the tab without reading it shouldn't burn
  // the one time we explain the game. The ? button always reopens it, always from step one.
  var HELP_KEY = "promptle.help";
  function helpSeen() { try { return localStorage.getItem(HELP_KEY) === "1"; } catch (e) { return false; } }
  function showHelp() { tutStep = 0; renderTutStep(); overlay.classList.add("show"); }
  function hideHelp() {
    overlay.classList.remove("show");
    try { localStorage.setItem(HELP_KEY, "1"); } catch (e) {}
  }

  hintBtn.addEventListener("click", function () {
    if (over || hintsUsed >= MAX_HINTS) return;
    var idx = pickHintIndex();
    if (idx === null) { setMsg(B().ui.hintNone, true); return; }   // don't spend the hint
    // Persist every revealed position: a refresh cannot refund or duplicate any hint.
    state.hints.push(idx);
    hintsUsed = state.hints.length;
    updateKey(normChar(answer[idx]), "correct");
    refreshGhosts(curRow);
    saveState();
    try { pBump("hint"); } catch (e) {}
    updateHintUI();
    setMsg(B().ui.hint, true);
  });
  document.getElementById("rClose").addEventListener("click", hideResult);
  statsBtn.addEventListener("click", toggleResult);
  nextBtn.addEventListener("click", function () {
    if (practice) { hideResult(); loadDay(); } else setPractice(true);
  });
  rShare.addEventListener("click", shareGame);

  // tell the embedding page (the ICAIRE drawer demo) which language is showing,
  // so its pull-tab can read GLOSSLE / خمِّن to match
  function postLang() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "glossle-lang", lang: lang, name: B().ui.name }, "*");
      }
    } catch (e) {}
  }

  document.getElementById("themeBtn").addEventListener("click", function () {
    var root = document.documentElement, cur = root.getAttribute("data-theme");
    var isDark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", isDark ? "light" : "dark");
    paintThemeSwitch();
  });
  function paintThemeSwitch() {
    var cur = document.documentElement.getAttribute("data-theme");
    var isDark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.getElementById("themeBtn").setAttribute("aria-checked", isDark ? "true" : "false");
  }
  paintThemeSwitch();
  try {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    (mq.addEventListener ? mq.addEventListener("change", paintThemeSwitch) : mq.addListener(paintThemeSwitch));
  } catch (e) {}
  langBtn.addEventListener("click", function () {
    lang = (lang === "en" ? "ar" : "en");
    applyStaticUI(); buildKeyboard(); loadDay(); postLang();
  });
  function paintDifficultyBtn() {
    diffBtn.textContent = B().ui.diffLabels[difficulty];
    diffBtn.className = "icon-btn diff-btn diff-" + difficulty;
  }
  diffBtn.addEventListener("click", function () {
    var idx = DIFFICULTY_ORDER.indexOf(difficulty);
    setDifficulty(DIFFICULTY_ORDER[(idx + 1) % DIFFICULTY_ORDER.length]);
  });
  document.getElementById("helpBtn").addEventListener("click", showHelp);
  document.getElementById("okBtn").addEventListener("click", tutAdvance);
  document.getElementById("backBtn").addEventListener("click", tutBack);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) hideHelp(); });
  // Progressive enhancement: no speechSynthesis support (rare, but real on some embedded
  // WebViews) just hides the button rather than offering a control that silently fails.
  if (window.speechSynthesis) {
    listenBtn.addEventListener("click", function () {
      try {
        window.speechSynthesis.cancel();
        var utter = new SpeechSynthesisUtterance(clueEl.textContent);
        utter.lang = lang === "ar" ? "ar-SA" : "en-US";
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    });
  } else {
    listenBtn.style.display = "none";
  }
  var menuBtn = document.getElementById("menuBtn"), menuEl = document.getElementById("menu");
  function setMenu(open) { menuEl.classList.toggle("show", open); menuBtn.setAttribute("aria-expanded", open ? "true" : "false"); }
  menuBtn.addEventListener("click", function (e) { e.stopPropagation(); setMenu(!menuEl.classList.contains("show")); });
  document.addEventListener("click", function (e) { if (!menuEl.contains(e.target)) setMenu(false); });
  passportBtn.addEventListener("click", function () { setMenu(false); showPassport(); });
  Array.prototype.forEach.call(document.querySelectorAll(".seg-btn"), function (b) {
    b.addEventListener("click", function () {
      applyTextSize(b.dataset.size);
      scheduleResize();   // tiles/keys are sized in JS px — re-measure against the new text metrics
    });
  });
  document.getElementById("passportCloseBtn").addEventListener("click", hidePassport);
  passportOverlay.addEventListener("click", function (e) { if (e.target === passportOverlay) hidePassport(); });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (overlay.classList.contains("show")) {
      if (e.key === "Escape") hideHelp(); else if (e.key === "Enter") tutAdvance();
      return;
    }
    if (e.key === "Escape" && menuEl.classList.contains("show")) { setMenu(false); return; }
    if (e.key === "Escape" && resultEl.classList.contains("show")) { hideResult(); return; }
    if (e.key === "Enter" || e.key === "Backspace" || acceptChar(e.key)) { e.preventDefault(); handleKey(e.key); }
  });

  // Keep the game at one scale on desktop as well: Safari/Chrome trackpad pinch
  // is delivered as a modifier wheel event, while keyboard zoom uses +/- or 0.
  document.addEventListener("wheel", function (e) {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive: false, capture: true });
  document.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (["+", "=", "-", "_", "0"].indexOf(e.key) !== -1) e.preventDefault();
  }, { capture: true });

  // Legacy Safari can still emit these gesture events despite the viewport lock.
  // Blocking them keeps the game fixed at its intended size on iPhone.
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (eventName) {
    document.addEventListener(eventName, function (e) { e.preventDefault(); }, { passive: false });
  });

  // Some iOS Safari builds ignore touch-action for double-tap zoom. Cancel a
  // repeated same-key tap before Safari can turn it into a page gesture, and
  // reject every multi-touch sequence as an extra pinch-zoom fallback.
  var lastTouchEnd = 0, lastTouchTarget = null;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    // Safari's zoom gesture needs two taps on the same spot. Let players sweep
    // quickly across different keyboard keys. For a repeated key, replay the
    // control click ourselves after cancelling Safari's native zoom gesture.
    if (now - lastTouchEnd < 350 && e.target === lastTouchTarget) {
      e.preventDefault();
      var repeatedControl = e.target.closest && e.target.closest("button");
      if (repeatedControl) repeatedControl.click();
    }
    lastTouchEnd = now;
    lastTouchTarget = e.target;
  }, { passive: false, capture: true });
  ["touchstart", "touchmove"].forEach(function (eventName) {
    document.addEventListener(eventName, function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false, capture: true });
  });

  function applyTileSize() {
    var size = tileSize(), fs = Math.round(size * 0.46);
    grid.forEach(function (row) { row.cells.forEach(function (c) { c.style.width = size + "px"; c.style.height = size + "px"; c.style.fontSize = fs + "px"; }); });
  }

  var rt = null, rt2 = null;
  function scheduleResize() {
    clearTimeout(rt); clearTimeout(rt2);
    // two passes: the first can land while the layout is still settling (orientation change,
    // the drawer sliding open) and latch an intermediate size, so re-measure once more after
    rt = setTimeout(applyTileSize, 150);
    rt2 = setTimeout(applyTileSize, 500);
  }
  window.addEventListener("resize", scheduleResize);
  // the window doesn't resize when the demo drawer slides the game into view, so watch the
  // element itself — this is what re-sizes a board that was first laid out while hidden
  if (window.ResizeObserver) { try { new ResizeObserver(scheduleResize).observe(wrapEl); } catch (e) {} }

  applyStaticUI();
  buildKeyboard();
  loadDay();
  postLang();
  if (!helpSeen()) showHelp();   // first visit ever, in either mode — never again after that
})();
</script>

<!-- ICAIRE booth analytics: one visit per browser per Riyadh-day, fire-and-forget.
     The per-day guard stops the booth screen (which reloads all day) from inflating the
     count, and keeps it closer to "visitors" than "page views". theme/device/returning are
     piggy-backed on the same guard so they sum to ~visits. Scan traffic also goes through
     /go/, so /stats/ can show visits and QR scans side by side. No PII — integers only. -->
<script>
(function () {
  try {
    var day = new Date(Date.now() + 3 * 3600 * 1000).toISOString().slice(0, 10);
    if (localStorage.getItem("promptle_pv") === day) return;
    var known = !!(localStorage.getItem("promptle.stats.en") ||
                   localStorage.getItem("promptle.stats.ar") ||
                   localStorage.getItem("promptle_pv"));
    localStorage.setItem("promptle_pv", day);
    var b = window.pBump || function () {};
    b("visits");
    b("vday-" + day);
    b(known ? "returning" : "newvisitor");
    var attr = document.documentElement.getAttribute("data-theme");
    var dark = attr ? attr === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    b(dark ? "theme-dark" : "theme-light");
    b(matchMedia("(max-width: 768px)").matches ? "device-mobile" : "device-desktop");
  } catch (e) {}
})();
</script>
