<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening Promptle…</title>
<style>
  :root { --bg:#0f2a38; --ink:#fff; --accent:#8dc63f; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f7f5; --ink:#16242d; --accent:#1c5631; } }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:center;
    font-family: Calibri, Carlito, "Segoe UI", system-ui, -apple-system, sans-serif; }
  .box { text-align:center; padding:24px; }
  .dot { width:44px; height:44px; margin:0 auto 16px; border-radius:50%;
    border:4px solid var(--accent); border-top-color:transparent; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  a { color:var(--accent); }
  p { font-size:15px; opacity:.85; }
</style>
<div class="box">
  <div class="dot"></div>
  <p>Opening Promptle… <a id="fallback" href="https://ahmed-khayat.github.io/promptle/">tap here</a> if nothing happens.</p>
</div>
<script>
(function () {
  var DEST = "https://ahmed-khayat.github.io/promptle/";
  var NS = "promptle-icaire";                 // scan counter namespace (abacus.jasoncameron.dev)
  var API = "https://abacus.jasoncameron.dev/hit/" + NS + "/";
  var p = new URLSearchParams(location.search);
  var v = p.get("v");
  var key = v === "d" ? "dark" : v === "l" ? "light" : "direct";

  var done = false;
  function go() { if (done) return; done = true; location.replace(DEST); }
  setTimeout(go, 1500);                       // hard cap — never trap the visitor

  try {
    var hits = [fetch(API + "total", { cache: "no-store", keepalive: true }),
                fetch(API + key,     { cache: "no-store", keepalive: true })];
    Promise.allSettled(hits).then(go, go);
  } catch (e) { go(); }
})();
</script>
